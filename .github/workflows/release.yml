name: Release Amygdala

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Check tag matches plugin version
        run: node -e 'if (process.env.GITHUB_REF_NAME.replace(/^v/, "") !== require("./manifest.json").version) process.exit(1)'
      - name: Package mobile fallback
        run: zip -j dist/amygdala-mobile.zip dist/main.js dist/manifest.json dist/styles.css
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/main.js dist/manifest.json dist/styles.css dist/amygdala-mobile.zip --generate-notes --verify-tag
