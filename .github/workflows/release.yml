name: Release Amygdala

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - name: Check tag matches plugin version
        run: node -e 'if (process.env.GITHUB_REF_NAME.replace(/^v/, "") !== require("./manifest.json").version) process.exit(1)'
      - name: Package mobile fallback
        run: zip -j dist/amygdala-mobile.zip dist/main.js dist/manifest.json dist/styles.css
      - name: Create prerelease if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag --prerelease
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/main.js dist/manifest.json dist/styles.css dist/amygdala-mobile.zip --clobber
